<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento IoT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --fundo: #eaf0ec;
    --painel: #f8faf8;
    --tinta: #1b2a22;
    --suave: #5d6f64;
    --linha: #cbd8d0;
    --ok: #2e7d4f;
    --alerta: #b4532a;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #17211b;
      --painel: #1f2c25;
      --tinta: #e4ede7;
      --suave: #96a89c;
      --linha: #33463b;
      --ok: #5bc08a;
      --alerta: #e08a5f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 1.6rem; margin: 0; font-weight: 650; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; font-weight: 600; }
  .sub { color: var(--suave); font-size: .9rem; margin-top: 4px; }

  .nos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .no { background: var(--painel); border: 1px solid var(--linha); border-left-width: 5px; border-radius: 8px; padding: 14px 16px; }
  .no-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .no-nome { font-weight: 650; }
  .no-proto { color: var(--suave); font-size: .85rem; }
  .estado { font-size: .85rem; margin: 2px 0 10px; }
  .estado.ok { color: var(--ok); }
  .estado.off { color: var(--alerta); }
  .medidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .medida b { display: block; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .medida span { color: var(--suave); font-size: .8rem; }
  .medida.baixa b { color: var(--alerta); } }

  .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .painel { background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 16px; }
  .painel canvas { width: 100% !important; height: 240px !important; }

    .controles { display: flex; gap: 6px; flex-wrap: wrap; }
  .controles button {
    border: 1px solid var(--linha); background: var(--painel); color: var(--tinta);
    padding: 6px 14px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  .controles button[aria-pressed="true"] { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); }
  .controles button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  .tabela-rolagem { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--suave); font-weight: 500; }

  .vazio { color: var(--suave); padding: 24px 0; }
  #erro { color: var(--alerta); margin-bottom: 12px; }

  .alertas { display: grid; gap: 8px; margin-bottom: 24px; }
  .alerta {
    background: var(--painel); border: 1px solid var(--alerta); border-left-width: 5px;
    border-radius: 8px; padding: 10px 14px; color: var(--alerta); font-size: .95rem;
  }
  .alerta small { color: var(--suave); margin-left: 6px; }

</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Monitoramento IoT</h1>
      <div class="sub" id="sub">Carregando…</div>
    </div>
    <div class="controles" id="periodos" role="group" aria-label="Período">
      <button data-horas="1">1 h</button>
      <button data-horas="6" aria-pressed="true">6 h</button>
      <button data-horas="24">24 h</button>
      <button data-horas="168">7 dias</button>
    </div>
  </header>

  <div id="erro" role="alert"></div>
  <section class="alertas" id="alertas" role="status" aria-live="polite"></section>
  <section class="nos" id="nos" aria-label="Estado dos nós"></section>
  <section class="graficos">
    <div class="painel"><h2>Temperatura (°C)</h2><canvas id="g-temperatura"></canvas></div>
    <div class="painel"><h2>Umidade do ar (%)</h2><canvas id="g-umidade_ar"></canvas></div>
    <div class="painel"><h2>Umidade do solo (%)</h2><canvas id="g-umidade_solo"></canvas></div>
  </section>
  <section class="painel">
    <h2 id="titulo-tabela">Estatísticas do período</h2>
    <div class="tabela-rolagem">
      <table>
        <thead>
          <tr>
            <th>Nó</th><th>Leituras</th>
            <th>Temp. média</th><th>mín</th><th>máx</th>
            <th>Ar médio</th><th>mín</th><th>máx</th>
            <th>Solo médio</th><th>mín</th><th>máx</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const LIMITE_SEM_SINAL = {{ limite_sem_sinal }};   // segundos, vem do app.py
const ATUALIZA_A_CADA_MS = 10000;
const PALETA = ["#2e7d4f", "#c2571f", "#2f6fb0", "#8a5bb5", "#b08a1e", "#1e8a8a"];

const GRANDEZAS = ["temperatura", "umidade_ar", "umidade_solo"];
const UNIDADES = { temperatura: "°C", umidade_ar: "%", umidade_solo: "%" };

const ROTULOS = { temperatura: "Temperatura", umidade_ar: "Umidade do ar", umidade_solo: "Umidade do solo" };

let horas = 6;
const coresPorNo = {};

const graficos = {};

// Cada nó mantém sempre a mesma cor, em todos os gráficos e cards
function corDoNo(id) {
  if (!(id in coresPorNo)) coresPorNo[id] = PALETA[Object.keys(coresPorNo).length % PALETA.length];
  return coresPorNo[id];
}

const fmt = (v, casas = 1) => (v === null || v === undefined) ? "–" : Number(v).toFixed(casas);

function tempoRelativo(seg) {
  if (seg < 60) return `há ${seg} s`;
  if (seg < 3600) return `há ${Math.floor(seg / 60)} min`;
  return `há ${Math.floor(seg / 3600)} h`;
}

function desenharAlertas(ativos) {
  // Sem alertas ativos a faixa fica vazia e não ocupa espaço
  document.getElementById("alertas").innerHTML = ativos.map(a => `
    <div class="alerta">
      <b>${a.no_id}</b>: ${ROTULOS[a.grandeza]} baixa
      (${fmt(a.valor)} ${UNIDADES[a.grandeza]}, mínimo ${fmt(a.limite_minimo)} ${UNIDADES[a.grandeza]})
      <small>desde ${a.criado_em}</small>
    </div>`).join("");
}

function desenharNos(ultimas, ativos) {
  // Conjunto "no|grandeza" dos alertas ativos, para consulta rápida ao montar cada card
  const emAlerta = new Set(ativos.map(a => a.no_id + "|" + a.grandeza));
  const classe = (n, g) => emAlerta.has(n.no_id + "|" + g) ? "medida baixa" : "medida";
  
  const caixa = document.getElementById("nos");
  if (!ultimas.length) {
    caixa.innerHTML = '<div class="vazio">Nenhuma leitura no banco ainda. Inicie o gateway e os nós.</div>';
    return;
  }
  caixa.innerHTML = ultimas.map(n => {
    const online = n.idade_s <= LIMITE_SEM_SINAL;
    return `
      <article class="no" style="border-left-color:${corDoNo(n.no_id)}">
        <div class="no-topo"><span class="no-nome">${n.no_id}</span><span class="no-proto">${n.protocolo}</span></div>
        <div class="estado ${online ? "ok" : "off"}">${online ? "Recebendo" : "Sem sinal"}, última leitura ${tempoRelativo(n.idade_s)}</div>
        <div class="medidas">
          <div class="${classe(n, "temperatura")}"><b>${fmt(n.temperatura)}°</b><span>Temperatura</span></div>
          <div class="${classe(n, "umidade_ar")}"><b>${fmt(n.umidade_ar, 0)}%</b><span>Ar</span></div>
          <div class="${classe(n, "umidade_solo")}"><b>${fmt(n.umidade_solo, 0)}%</b><span>Solo</span></div>
        </div>
      </article>`;
  }).join("");
}

function criarGrafico(grandeza) {
  const ctx = document.getElementById("g-" + grandeza);
  graficos[grandeza] = new Chart(ctx, {
    type: "line",
    data: { datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      parsing: false,
      interaction: { mode: "nearest", intersect: false },
      elements: { point: { radius: 0, hitRadius: 8 }, line: { borderWidth: 2, tension: 0.2 } },
      scales: {
        x: {
          type: "linear",
          ticks: {
            maxTicksLimit: 6,
            callback: v => new Date(v).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
          }
        },
        y: { title: { display: true, text: UNIDADES[grandeza] } }
      },
      plugins: {
        tooltip: {
          callbacks: {
            title: itens => new Date(itens[0].parsed.x).toLocaleString("pt-BR"),
            label: item => `${item.dataset.label}: ${item.parsed.y} ${UNIDADES[grandeza]}`
          }
        }
      }
    }
  });
}

function desenharGraficos(series) {
  const nos = Object.keys(series).sort();
  GRANDEZAS.forEach(g => {
    graficos[g].data.datasets = nos.map(no => ({
      label: no,
      data: series[no][g],
      borderColor: corDoNo(no),
      backgroundColor: corDoNo(no),
      spanGaps: true
    }));
    graficos[g].update();
  });
}

function desenharTabela(estatisticas) {
  const corpo = document.getElementById("tabela");
  if (!estatisticas.length) {
    corpo.innerHTML = '<tr><td colspan="11" class="vazio">Sem leituras neste período.</td></tr>';
    return;
  }
  corpo.innerHTML = estatisticas.map(e => `
    <tr>
      <td>${e.no_id}</td><td>${e.total}</td>
      <td>${fmt(e.temp_media)}</td><td>${fmt(e.temp_min)}</td><td>${fmt(e.temp_max)}</td>
      <td>${fmt(e.ar_media)}</td><td>${fmt(e.ar_min)}</td><td>${fmt(e.ar_max)}</td>
      <td>${fmt(e.solo_media)}</td><td>${fmt(e.solo_min)}</td><td>${fmt(e.solo_max)}</td>
    </tr>`).join("");
}

async function atualizar() {
  const erro = document.getElementById("erro");
  try {
    const [resumo, series, alertas] = await Promise.all([
        fetch(`/api/resumo?horas=${horas}`).then(r => { if (!r.ok) throw new Error("resumo"); return r.json(); }),
        fetch(`/api/series?horas=${horas}`).then(r => { if (!r.ok) throw new Error("séries"); return r.json(); }),
        fetch("/api/alertas").then(r => { if (!r.ok) throw new Error("alertas"); return r.json(); })
    ]);
    erro.textContent = "";
    desenharNos(resumo.ultimas, alertas.ativos);
    desenharAlertas(alertas.ativos);
    desenharTabela(resumo.estatisticas);
    desenharGraficos(series);
    document.getElementById("sub").textContent =
      `${resumo.total_geral} leituras no banco · atualizado às ${new Date().toLocaleTimeString("pt-BR")}`;
  } catch (e) {
    erro.textContent = "Não foi possível ler os dados. Verifique se o MariaDB está rodando e se o app.py está ativo.";
  }
}

document.getElementById("periodos").addEventListener("click", ev => {
  const botao = ev.target.closest("button");
  if (!botao) return;
  horas = Number(botao.dataset.horas);
  document.querySelectorAll("#periodos button").forEach(b => b.setAttribute("aria-pressed", b === botao));
  document.getElementById("titulo-tabela").textContent = "Estatísticas do período (" + botao.textContent + ")";
  atualizar();
});

GRANDEZAS.forEach(criarGrafico);
atualizar();
setInterval(atualizar, ATUALIZA_A_CADA_MS);
</script>
</body>
</html>
